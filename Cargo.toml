[package]
name = "tlsdays"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
license = "MIT OR Apache-2.0"
description = "Report days until TLS certificates expire across many hostnames in parallel"
repository = "https://github.com/malisetti/tlsdays"
readme = "README.md"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
webpki-roots = "0.26"
x509-parser = "0.16"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[features]
default = []
live-tests = []
